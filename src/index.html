<!doctype html>
<html lang="en">

<head>
  <!--

  JavaScript Snake
  https://patorjk.com/games/snake

  Source code is available here: https://github.com/patorjk/JavaScript-Snake

  -->
  <meta charset="utf-8" />
  <title>JavaScript Snake</title>
  <link rel="stylesheet" id="style" type="text/css" href="css/main-snake.css" />
  <link rel="shortcut icon" href="css/images/favicon.png" />
  <style>
    .snake-toolbar {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10000;
      padding: 5px;
    }
  </style>
  <script>
    // To add a theme, add its stylesheet to src/css and push an entry here.
    // The dropdown is built from this array; "selected" marks the default theme.
    const THEMES = [
      { label: "Light Theme by yokesharun", url: "css/light-snake.css" },
      { label: "Main Theme by patorjk", url: "css/main-snake.css", selected: true },
      { label: "Dark Theme by KenyStev", url: "css/dark-snake.css" },
      { label: "Green Theme by CoffeeCatDE", url: "css/green-snake.css" },
      { label: "Matrix Theme by Geahad Haymor", url: "css/matrix-snake.css" },
      { label: "Theme by Senura Ratnayake", url: "css/Senura-snake.css" },
      { label: "Snake Head Theme by Rb64", url: "css/head-snake.css" },
      { label: "Black and purple Theme by LucassSantoss", url: "css/black-snake.css" },
      { label: "Neon Theme by Daisy21000", url: "css/neon-snake.css" },
      { label: "Clean Theme by CrashoutKing123", url: "css/clean-snake.css" },
      { label: "Original Theme by DylanLCrocker", url: "css/blue-snake.css" },
      { label: "Golden Theme By JosephVoboril29", url: "css/golden-snake.css" },
      { label: "Cotton Candy Theme by KiwiNguyen29", url: "css/cotton-candy-snake.css" },
      { label: "OG Theme by NevanJohnson", url: "css/og-snake.css" },
    ];

    function getTheme() {
      function changeTheme(themeUrl) {
        const elm = document.getElementById("style");
        elm && elm.remove();

        const newCss = document.createElement("link");
        newCss.id = "style";
        newCss.rel = "stylesheet";
        newCss.type = "text/css";
        newCss.href = themeUrl;
        document.head.appendChild(newCss);
      }

      const index = document.getElementById("select").selectedIndex;
      const theme = THEMES[index] || THEMES.find((t) => t.selected) || THEMES[0];
      changeTheme(theme.url + "?" + Math.random());

      setTimeout(function () {
        document.getElementById("game-area").focus();
      }, 10);
    }
  </script>
  <!--
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-352HTB3H82"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-352HTB3H82');
  </script>
  --></head>
  <body>
    <div class="snake-toolbar">
      <div style="display: inline-block; margin-right: 10px">
        <span>Theme:</span>
        <select autocomplete="off" id="select"></select>
      </div>
      <div style="display: inline-block; margin-right: 10px">
        <span>Mode:</span>
        <select id="selectMode">
          <option value="100">Easy</option>
          <option value="75" selected>Medium</option>
          <option value="50">Hard</option>
          <option value="25">Impossible</option>
          <option value="110">Rush</option>
        </select>
      </div>
      <button id="go_full_screen">Full Screen</button>
      <br />
    </div>

  <div id="mode-wrapper" style="display: inline; width: auto"></div>

  <div id="game-area" tabindex="0"></div>
  <script type="text/javascript" src="js/snake.js"></script>
  <script type="text/javascript" src="js/init.js"></script>
  <script type="text/javascript">
    const themeSelect = document.getElementById('select');
    THEMES.forEach(function (theme) {
      const option = document.createElement('option');
      option.text = theme.label;
      option.selected = !!theme.selected;
      themeSelect.add(option);
    });
    themeSelect.addEventListener('change', getTheme);

    function go_full_screen() {
      const elem = document.documentElement;
      try {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        } else if (elem.mozRequestFullScreen) {
          elem.mozRequestFullScreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } catch (err) {
        console.error(err);
        alert("Sorry, fullscreen won't work in this setup.");
      }
    }

    document.getElementById('go_full_screen').addEventListener('click', go_full_screen);
  </script>
</body>

</html>
